x-broker-env: &broker-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
  PARTITION_COUNT: ${PARTITION_COUNT:-4}
  PARTITION_PREFIX_LENGTH: ${PARTITION_PREFIX_LENGTH:-5}
  MAX_RETRIES: ${MAX_RETRIES:-3}
  RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-2000}

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-ecopulse_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecopulse_pass}
  POSTGRES_DB: ${POSTGRES_DB:-ECOPULSE_DB}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PORT:-4500}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ingestion-service
      - query-service
      - notification-service
    restart: unless-stopped
    networks:
      - ecopulse-net

  ingestion-service:
    build:
      context: ./backend
      dockerfile: services/ingestion-service/Dockerfile
    environment:
      <<: *broker-env
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FAULT_INJECTION: ${FAULT_INJECTION:-false}
    ports:
      - "4501:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecopulse-net

  query-service:
    build:
      context: ./backend
      dockerfile: services/query-service/Dockerfile
    environment:
      <<: [*postgres-env, *redis-env]
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
    ports:
      - "4502:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ecopulse-net

  geo-processing-service:
    build:
      context: ./backend
      dockerfile: services/geo-processing-service/Dockerfile
    environment:
      <<: [*broker-env, *postgres-env, *redis-env]
      NODE_ENV: ${NODE_ENV:-development}
      PARTITIONS: ${PARTITIONS:-all}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ecopulse-net

  alert-service:
    build:
      context: ./backend
      dockerfile: services/alert-service/Dockerfile
    environment:
      <<: *broker-env
      NODE_ENV: ${NODE_ENV:-development}
      ALERT_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-3}
      ALERT_RADIUS_KM: ${ALERT_RADIUS_KM:-5}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecopulse-net

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: [*broker-env, *postgres-env, *redis-env]
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FIREBASE_SERVICE_ACCOUNT_PATH: /usr/src/app/firebase/service-account.json
    volumes:
      - ./firebase:/usr/src/app/firebase:ro
    ports:
      - "4503:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ecopulse-net

  db-migrate:
    build:
      context: ./backend
      dockerfile: shared/Dockerfile
    environment:
      <<: *postgres-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - ecopulse-net

  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecopulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecopulse_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ECOPULSE_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecopulse_user} -d ${POSTGRES_DB:-ECOPULSE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ecopulse-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ecopulse-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ecopulse-net

volumes:
  postgis_data:
  redis_data:
  rabbitmq_data:

networks:
  ecopulse-net:
    driver: bridge
