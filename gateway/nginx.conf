# EcoPulse API Gateway
# Ponto único de entrada para o app móvel. Roteia cada rota para o microsserviço dono
# dela, de modo que o app continue apontando para um único host:porta (10.0.2.2:4500).
#
#   POST /api/reports      -> ingestion-service    (escrita: publica evento no RabbitMQ)
#   GET  /api/reports      -> query-service        (leitura: cache-aside Redis -> PostGIS)
#   *    /api/devices/*    -> notification-service (registro de token FCM)
#   ws://host:4500/        -> notification-service (WebSocket de alertas de proximidade)

# Resolver interno do Docker: permite que os upstreams sejam resolvidos dinamicamente
# (containers recriados recebem novos IPs sem exigir restart do gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    set $ingestion    http://ingestion-service:3000;
    set $query        http://query-service:3000;
    set $notification http://notification-service:3000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # Separação leitura/escrita (CQRS): mesmo path, serviços distintos por método HTTP
    location /api/reports {
        if ($request_method = POST) {
            proxy_pass $ingestion;
        }
        proxy_pass $query;
    }

    location /api/devices {
        proxy_pass $notification;
    }

    # Raiz: conexões WebSocket (e demais rotas) vão para o notification-service
    location / {
        proxy_pass $notification;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
